<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário com reCAPTCHA</title>
  <!-- Script oficial do Google reCAPTCHA -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; margin-top: 50px; }
    form { display: flex; flex-direction: column; gap: 15px; width: 300px; }
    input, button { padding: 10px; font-size: 16px; }
  </style>
</head>
<body>

  <form id="contactForm">
    <h2>Contato</h2>
    <input type="text" id="nome" placeholder="Seu nome" required>
    <input type="email" id="email" placeholder="Seu e-mail" required>
    
    <!-- Widget do reCAPTCHA -->
    <div class="g-recaptcha" data-sitekey="SUA_CHAVE_DE_SITE_AQUI"></div>
    
    <button type="submit">Enviar</button>
    <p id="status"></p>
  </form>

  <script>
    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Captura o token gerado pelo usuário ao clicar no checkbox
      const recaptchaToken = grecaptcha.getResponse();
      const status = document.getElementById('status');

      if (!recaptchaToken) {
        status.textContent = 'Por favor, marque a caixa "Não sou um robô".';
        status.style.color = 'red';
        return;
      }

      const dados = {
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        token: recaptchaToken
      };

      const response = await fetch('/enviar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
      });

      const resultado = await response.json();
      status.textContent = resultado.mensagem;
      status.style.color = resultado.sucesso ? 'green' : 'red';
      
      // Reseta o reCAPTCHA após o envio
      grecaptcha.reset();
    });
  </script>
</body>
</html>
